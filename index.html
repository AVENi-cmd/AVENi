<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قائمة الروابط | ΛVENi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-h-screen;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            width: 100%;
            max-width: 600px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-name {
            font-size: 32px;
            font-weight: 200;
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        .links-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: white;
        }

        .link-item:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .link-content {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-grow: 1;
            justify-content: flex-end; /* للمحاذاة اليمين */
        }

        .link-text {
            font-size: 18px;
            font-weight: 400;
        }

        .icon-wrapper {
            width: 35px;
            height: 35px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .icon-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* تنسيق خاص لأيقونة سناب شات الجديدة لضمان الوضوح والمطابقة */
        .snap-icon {
            filter: drop-shadow(0 0 5px rgba(255, 252, 0, 0.3));
        }

        .arrow {
            opacity: 0.6;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="brand-name">ΛVENi</h1>
        </div>
        
        <div class="links-list">
            <!-- الموقع الرسمي -->
            <a href="#" class="link-item">
                <span class="arrow">▼</span>
                <div class="link-content">
                    <span class="link-text">الموقع الرسمي للمنشأة</span>
                    <div class="icon-wrapper">
                        <!-- أيقونة SVG للكرة الأرضية -->
                        <svg viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="2" y1="12" x2="22" y2="12"></line>

                        </svg>
                    </div>
                </div>
            </a>

                <div class="link-content">
                    <span class="link-text">تابعنا عبر إنستغرام</span>
